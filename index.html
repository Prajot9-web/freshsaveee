<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshSave AI - Smart Inventory & Markdown Engine</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-emerald-800 rounded-lg">
          <i data-lucide="package" class="w-6 h-6 text-emerald-200"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">FreshSave AI</h1>
          <p class="text-xs text-emerald-100">By Prajot Kamble • Inventory Risk & Dynamic Pricing Engine</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs bg-emerald-800/80 px-3 py-1.5 rounded-full border border-emerald-600">
        <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
        Zero-Waste AI Engine Active
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Left Column: Inventory List & Actions -->
    <div class="lg:col-span-2 space-y-6">
      <!-- Add Item Form -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
        <h2 class="text-base font-semibold mb-3 flex items-center gap-2 text-slate-800">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-600"></i> Add Perishable Item
        </h2>
        <form id="item-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-xs font-medium text-slate-500 mb-1">Item Name</label>
            <input type="text" id="item-name" required placeholder="e.g. Sourdough Bread" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-200">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Category</label>
            <select id="item-category" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-200 bg-white">
              <option value="Bakery">Bakery</option>
              <option value="Dairy">Dairy</option>
              <option value="Produce">Produce</option>
              <option value="Cooked Meals">Cooked Meals</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Price (₹)</label>
            <input type="number" id="item-price" required min="1" placeholder="100" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-200">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Stock (Units)</label>
            <input type="number" id="item-qty" required min="1" placeholder="10" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-200">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Expiry In (Hours)</label>
            <input type="number" id="item-hours" required min="1" placeholder="6" class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 border-slate-200">
          </div>
          <div class="sm:col-span-2 flex items-end">
            <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-lg transition-colors flex items-center justify-center gap-1.5 shadow-sm">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Save to Inventory
            </button>
          </div>
        </form>
      </div>

      <!-- Inventory Table / Cards -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold flex items-center gap-2 text-slate-800">
            <i data-lucide="trending-down" class="w-5 h-5 text-emerald-600"></i> Tracked Inventory & Markdowns
          </h2>
          <span id="items-count" class="text-xs text-slate-500 font-medium">0 items</span>
        </div>
        <div id="inventory-list" class="space-y-3">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>

    <!-- Right Column: Campaign Generator -->
    <div class="space-y-4">
      <h2 class="text-base font-semibold flex items-center gap-2 text-slate-800">
        <i data-lucide="share-2" class="w-5 h-5 text-emerald-600"></i> Marketing Campaign Generator
      </h2>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">Target Channel</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btn-channel-whatsapp" onclick="setChannel('whatsapp')" class="py-1.5 text-xs font-medium rounded-lg border bg-emerald-600 text-white border-emerald-600">
              WhatsApp
            </button>
            <button type="button" id="btn-channel-instagram" onclick="setChannel('instagram')" class="py-1.5 text-xs font-medium rounded-lg border bg-slate-50 text-slate-700 border-slate-200">
              Instagram
            </button>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">Language</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" id="btn-lang-en" onclick="setLang('en')" class="py-1.5 text-xs font-medium rounded-lg border bg-emerald-600 text-white border-emerald-600">English</button>
            <button type="button" id="btn-lang-hi" onclick="setLang('hi')" class="py-1.5 text-xs font-medium rounded-lg border bg-slate-50 text-slate-700 border-slate-200">Hindi</button>
            <button type="button" id="btn-lang-mr" onclick="setLang('mr')" class="py-1.5 text-xs font-medium rounded-lg border bg-slate-50 text-slate-700 border-slate-200">Marathi</button>
          </div>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-600 block mb-1">Generated Promotional Copy</label>
          <textarea id="campaign-output" readonly rows="7" class="w-full text-xs font-mono p-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-700 focus:outline-none resize-none" placeholder='Click "Generate Copy" on any product card...'></textarea>
        </div>

        <button id="copy-btn" onclick="copyCampaignText()" class="w-full py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold rounded-lg flex items-center justify-center gap-2 transition-colors">
          <i data-lucide="copy" class="w-4 h-4 text-emerald-400"></i> Copy to Clipboard
        </button>
        <p id="copy-status" class="text-center text-[11px] text-emerald-600 font-medium hidden">Copied to clipboard!</p>
      </div>
    </div>
  </main>

  <script>
    // Initial Seed Data
    const defaultItems = [
      { id: '1', name: 'Artisan Sourdough Loaf', category: 'Bakery', quantity: 8, originalPrice: 120, hoursUntilExpiry: 4 },
      { id: '2', name: 'Fresh Paneer (500g)', category: 'Dairy', quantity: 12, originalPrice: 180, hoursUntilExpiry: 10 },
      { id: '3', name: 'Organic Spinach Bunches', category: 'Produce', quantity: 15, originalPrice: 40, hoursUntilExpiry: 18 },
      { id: '4', name: 'Paneer Butter Masala Meal', category: 'Cooked Meals', quantity: 5, originalPrice: 220, hoursUntilExpiry: 2 }
    ];

    let items = JSON.parse(localStorage.getItem('freshsave_items')) || defaultItems;
    let currentChannel = 'whatsapp';
    let currentLang = 'en';
    let selectedItemForCampaign = items[0] || null;

    function saveItems() {
      localStorage.setItem('freshsave_items', JSON.stringify(items));
      renderItems();
    }

    function calculateDiscount(hours) {
      if (hours <= 3) return 50;
      if (hours <= 6) return 35;
      if (hours <= 12) return 20;
      return 10;
    }

    function getRiskBadge(hours) {
      if (hours <= 4) {
        return { label: 'Critical Risk', classes: 'text-red-700 bg-red-50 border-red-200' };
      }
      if (hours <= 12) {
        return { label: 'Moderate Risk', classes: 'text-amber-700 bg-amber-50 border-amber-200' };
      }
      return { label: 'Optimal', classes: 'text-emerald-700 bg-emerald-50 border-emerald-200' };
    }

    function setChannel(channel) {
      currentChannel = channel;
      document.getElementById('btn-channel-whatsapp').className = channel === 'whatsapp' ? 'py-1.5 text-xs font-medium rounded-lg border bg-emerald-600 text-white border-emerald-600' : 'py-1.5 text-xs font-medium rounded-lg border bg-slate-50 text-slate-700 border-slate-200';
      document.getElementById('btn-channel-instagram').className = channel === 'instagram' ? 'py-1.5 text-xs font-medium rounded-lg border bg-emerald-600 text-white border-emerald-600' : 'py-1.5 text-xs font-medium rounded-lg border bg-slate-50 text-slate-700 border-slate-200';
      if (selectedItemForCampaign) generateCampaign(selectedItemForCampaign);
    }

    function setLang(lang) {
      currentLang = lang;
      ['en', 'hi', 'mr'].forEach(l => {
        const btn = document.getElementById(`btn-lang-${l}`);
        btn.className = l === lang ? 'py-1.5 text-xs font-medium rounded-lg border bg-emerald-600 text-white border-emerald-600' : 'py-1.5 text-xs font-medium rounded-lg border bg-slate-50 text-slate-700 border-slate-200';
      });
      if (selectedItemForCampaign) generateCampaign(selectedItemForCampaign);
    }

    function generateCampaign(item) {
      selectedItemForCampaign = item;
      const discount = calculateDiscount(item.hoursUntilExpiry);
      const discountedPrice = Math.round(item.originalPrice * (1 - discount / 100));
      let text = '';

      if (currentChannel === 'whatsapp') {
        if (currentLang === 'hi') {
          text = `⚡ *शाम का स्पेशल ऑफर!* ⚡\n\nताज़ा *${item.name}* अब केवल *₹${discountedPrice}* में (पहले ₹${item.originalPrice}, ${discount}% छूट)!\n\nस्टॉक सीमित है (${item.quantity} यूनिट बाकी)। ताज़ा सामान खत्म होने से पहले अभी आर्डर करें! 🏃💨`;
        } else if (currentLang === 'mr') {
          text = `⚡ *खास सायंकाळ ऑफर!* ⚡\n\nताजे *${item.name}* आता फक्त *₹${discountedPrice}* मध्ये (आधी ₹${item.originalPrice}, ${discount}% सूट)!\n\nमर्यादित साठा शिल्लक (${item.quantity} शिल्लक). लगेच भेट द्या आणि खरेदी करा! 🏃💨`;
        } else {
          text = `⚡ *Flash Evening Saver!* ⚡\n\nGet fresh *${item.name}* for just *₹${discountedPrice}* (was ₹${item.originalPrice}, ${discount}% OFF)!\n\nOnly ${item.quantity} left in stock. Grab yours before it's gone! 🏃💨`;
        }
      } else {
        text = `🚨 *FLASH DROP ALERT* 🚨\n\nDon't let good food go to waste! Grab fresh ${item.name} at flat ${discount}% OFF.\n\n💰 Deal: ₹${discountedPrice} (Original: ₹${item.originalPrice})\n📍 Available until stocks last.\n#ZeroWaste #SmartSavings #LocalBusiness #PuneFoodies`;
      }

      document.getElementById('campaign-output').value = text;
      document.getElementById('copy-status').classList.add('hidden');
    }

    function deleteItem(id) {
      items = items.filter(it => it.id !== id);
      saveItems();
    }

    function renderItems() {
      const listContainer = document.getElementById('inventory-list');
      const countEl = document.getElementById('items-count');
      countEl.innerText = `${items.length} items`;

      if (items.length === 0) {
        listContainer.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 text-center text-slate-500 text-sm">No inventory items tracked yet. Add one above!</div>`;
        return;
      }

      listContainer.innerHTML = items.map(item => {
        const risk = getRiskBadge(item.hoursUntilExpiry);
        const discount = calculateDiscount(item.hoursUntilExpiry);
        const finalPrice = Math.round(item.originalPrice * (1 - discount / 100));

        return `
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-semibold text-slate-900">${item.name}</span>
                <span class="text-[11px] px-2 py-0.5 rounded-full border font-medium ${risk.classes}">
                  ${risk.label}
                </span>
              </div>
              <div class="flex items-center gap-2.5 text-xs text-slate-500">
                <span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${item.category}</span>
                <span>•</span>
                <span>Stock: <strong>${item.quantity}</strong></span>
                <span>•</span>
                <span class="flex items-center gap-1 font-medium text-slate-700">
                  <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i> ${item.hoursUntilExpiry}h left
                </span>
              </div>
            </div>

            <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4">
              <div class="text-right">
                <div class="text-xs text-slate-400 line-through">₹${item.originalPrice}</div>
                <div class="text-base font-bold text-emerald-700">
                  ₹${finalPrice} <span class="text-xs font-semibold text-red-600">(-${discount}%)</span>
                </div>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="handleCampaignClick('${item.id}')" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 rounded-lg text-xs font-semibold flex items-center gap-1 transition-colors">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Copy
                </button>
                <button onclick="deleteItem('${item.id}')" class="p-1.5 hover:bg-red-50 text-slate-400 hover:text-red-600 rounded-lg transition-colors">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function handleCampaignClick(id) {
      const item = items.find(i => i.id === id);
      if (item) generateCampaign(item);
    }

    function copyCampaignText() {
      const output = document.getElementById('campaign-output');
      if (!output.value) return;
      navigator.clipboard.writeText(output.value).then(() => {
        const status = document.getElementById('copy-status');
        status.classList.remove('hidden');
        setTimeout(() => status.classList.add('hidden'), 2500);
      });
    }

    document.getElementById('item-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now().toString(),
        name: document.getElementById('item-name').value.trim(),
        category: document.getElementById('item-category').value,
        originalPrice: parseFloat(document.getElementById('item-price').value),
        quantity: parseInt(document.getElementById('item-qty').value),
        hoursUntilExpiry: parseInt(document.getElementById('item-hours').value),
      };
      items.unshift(newItem);
      saveItems();
      this.reset();
      generateCampaign(newItem);
    });

    // Initial render
    renderItems();
    if (items.length > 0) generateCampaign(items[0]);
  </script>
</body>
</html>
